name: Daily Instagram Day post
on:
  schedule:
    - cron: "34 17 * * *"   # 11:04 PM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Make images
        run: python post.py make
      - name: Commit images
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add out
          git commit -m "daily images" || true
          git push
      - name: Post + Story
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post.py publish
      - name: Refresh token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python post.py refresh
